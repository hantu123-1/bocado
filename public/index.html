<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F1">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1511">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bocado">
  <meta name="format-detection" content="telephone=no">
  <title>Bocado</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="estilos.css">
  <link rel="modulepreload" href="js/app.js">
</head>
<body>
  <main class="app">
    <section data-vista="hoy" aria-label="Hoy"></section>
    <section data-vista="progreso" aria-label="Progreso" hidden></section>
    <section data-vista="ayuno" aria-label="Ayuno" hidden></section>
    <section data-vista="mas" aria-label="Más" hidden></section>
  </main>

  <nav class="tabs" aria-label="Secciones">
    <button type="button" class="tab" data-tab="hoy" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg><span>Hoy</span>
    </button>
    <button type="button" class="tab" data-tab="progreso">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progreso</span>
    </button>
    <button type="button" class="tab tab--agregar" data-agregar-global aria-label="Agregar alimento">
      <span class="tab__circulo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
    </button>
    <button type="button" class="tab" data-tab="ayuno">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M10 2h4"/></svg><span>Ayuno</span>
    </button>
    <button type="button" class="tab" data-tab="mas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Más</span><span class="tab__punto" hidden></span>
    </button>
  </nav>

  <div class="toast" data-toast popover="manual" role="status" aria-live="polite"></div>
  <noscript>Bocado necesita JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
